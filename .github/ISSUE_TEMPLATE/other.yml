name: 其他反馈
description: 使用咨询、文档问题、兼容性反馈、授权与合作等非 Bug / 非功能建议
title: "[Other] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        这里适合提交不属于 Bug 报告或功能建议的内容。
        如果是可复现的软件问题，请改用 Bug 报告模板，以便附上环境与日志。

  - type: dropdown
    id: kind
    attributes:
      label: 反馈类型
      options:
        - 使用咨询
        - 文档错误 / 缺失
        - 兼容性反馈（系统 / 显卡 / FFmpeg）
        - 许可证与再分发
        - 合作 / 商务
        - 其他
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: 内容
      description: 请具体描述你的问题或反馈。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 相关资料
      description: 可附截图、链接、版本信息或已尝试过的做法。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue，确认不是重复内容。
          required: true
        - label: 我已阅读 README 与更新日志中的已知限制。
          required: true
