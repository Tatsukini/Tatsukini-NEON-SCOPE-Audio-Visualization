name: Bug 报告
description: 报告 NEON//SCOPE 的崩溃、异常或与预期不符的行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 Issue，并尽量在最新版本上复现。
        涉及导出的问题，请附上导出进度页的 `FFMPEG / ENCODE LOG` 内容。

  - type: dropdown
    id: version
    attributes:
      label: 版本
      description: 设置 → 关于 或启动横幅中显示的版本号
      options:
        - V0.1.3_1110_alpha_GPLver
        - V0.1.3_1110_alpha_canary
        - V0.1.2_1109_alpha
        - 其他版本 / 自行构建
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: 运行方式
      options:
        - Windows EXE（Release 下载）
        - 网页版（node server.mjs）
        - 源码自行构建
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题涉及的模块
      multiple: true
      options:
        - 视频导出（录制 / 转码 / 封装）
        - 音频播放 / 解码
        - MIDI 与钢琴卷帘
        - 可视化模块渲染
        - 动画时间轴 / 关键帧
        - 工程存档 / 舞台排版
        - 插件系统
        - 设置 / 界面
        - 性能 / 卡顿
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？如果有报错信息请一并贴出。
      placeholder: 简要描述问题现象
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序列出可以稳定复现的操作。
      placeholder: |
        1. 载入 ...
        2. 打开 ...
        3. 点击 ...
        4. 出现 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: Windows 版本、CPU / 显卡、WebView2 版本；导出问题请注明 FFmpeg 版本与编码器选择。
      placeholder: 例如 Windows 11 26200 / RTX 4060 / WebView2 130 / FFmpeg 7.1 / NVIDIA NVENC
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 可直接拖入图片；也可粘贴导出日志或 `neon-scope.log` 中的相关片段。请先移除个人信息。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 Issue，确认不是重复问题。
          required: true
        - label: 我使用的是最新版本，或已在最新版本上复现。
          required: true
        - label: 我已移除日志中的隐私信息（用户名、路径、音频内容等）。
          required: true
